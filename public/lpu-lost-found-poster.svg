<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 595.276 841.89" role="img" aria-labelledby="title description">
<title>LPU Smart Lost and Found System — campus poster</title>
<desc>A4 poster with a non-scannable QR placeholder, instructions for reporting and searching items, and a reminder to hand valuables to campus security.</desc>
<rect x="0" y="0" width="595.276" height="841.89" fill="#FFFFFF"/>
<rect x="0" y="0" width="595.276" height="251" fill="#102849"/>
<rect x="0" y="0" width="595.276" height="7" fill="#C5DFFF"/>
<rect x="40" y="34" width="35" height="35" fill="#FFFFFF"/>
<text x="57.5" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#102849" text-anchor="middle">LPU</text>
<text x="87" y="47" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">LPU SMART LOST AND FOUND SYSTEM</text>
<text x="87" y="64" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#C5DFFF" text-anchor="start">LOVELY PROFESSIONAL UNIVERSITY</text>
<text x="40" y="124" font-family="Helvetica, Arial, sans-serif" font-size="39" font-weight="700" fill="#FFFFFF" text-anchor="start">LOST SOMETHING?</text>
<text x="40" y="172" font-family="Helvetica, Arial, sans-serif" font-size="39" font-weight="700" fill="#C5DFFF" text-anchor="start">FOUND SOMETHING?</text>
<text x="42" y="215" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="start">Report it. Search it. Return it.</text>
<text x="297.638" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#485D73" text-anchor="middle">ONE CAMPUS. LOOKING OUT FOR EACH OTHER.</text>
<rect x="204" y="302" width="187" height="174" fill="#F0F6FD" stroke="#C8D8EB" stroke-width="1"/>
<text x="297.638" y="375" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#102849" text-anchor="middle">QR CODE</text>
<text x="297.638" y="399" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#102849" text-anchor="middle">PLACEHOLDER</text>
<text x="297.638" y="429" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#485D73" text-anchor="middle">Non-scannable</text>
<text x="297.638" y="460" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#485D73" text-anchor="middle">Replace with your verified website QR</text>
<text x="297.638" y="511" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#173453" text-anchor="middle">Scan here to report a lost item</text>
<text x="297.638" y="535" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#173453" text-anchor="middle">or submit a found item.</text>
<path d="M40 560 L555.276 560" fill="none" stroke="#D9E3EE" stroke-width="1"/>
<text x="40" y="588" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#485D73" text-anchor="start">THREE SIMPLE STEPS TO A SAFE RETURN</text>
<rect x="40" y="606" width="31" height="29" fill="#F0F6FD"/>
<text x="55.5" y="626" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#102849" text-anchor="middle">01</text>
<text x="40" y="656" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#102849" text-anchor="start">SCAN</text>
<text x="40" y="677" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#485D73" text-anchor="start">Scan the QR code.</text>
<rect x="215" y="606" width="31" height="29" fill="#F0F6FD"/>
<text x="230.5" y="626" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#102849" text-anchor="middle">02</text>
<text x="215" y="656" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#102849" text-anchor="start">REPORT OR SEARCH</text>
<text x="215" y="677" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#485D73" text-anchor="start">Report or search</text>
<text x="215" y="695" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#485D73" text-anchor="start">for the item.</text>
<rect x="390" y="606" width="31" height="29" fill="#F0F6FD"/>
<text x="405.5" y="626" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#102849" text-anchor="middle">03</text>
<text x="390" y="656" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#102849" text-anchor="start">VERIFY &amp; COLLECT</text>
<text x="390" y="677" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#485D73" text-anchor="start">Verify ownership</text>
<text x="390" y="695" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#485D73" text-anchor="start">and collect the item.</text>
<rect x="40" y="722" width="515.276" height="78" fill="#102849"/>
<text x="57" y="746" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#C5DFFF" text-anchor="start">FOUND SOMETHING VALUABLE?</text>
<text x="57" y="767" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="start">For valuable belongings, please hand them over</text>
<text x="57" y="785" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="start">to authorised campus security staff.</text>
<text x="297.638" y="824" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#485D73" text-anchor="middle">A little care. A safe return. A stronger campus community.</text>
</svg>